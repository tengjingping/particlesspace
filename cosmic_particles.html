<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Particle Streams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .info {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            text-shadow: none;
            z-index: 100;
            max-width: 400px;
            text-align: center;
        }
        
        .info h2 {
            margin-bottom: 10px;
            color: #888;
            text-shadow: none;
            font-size: 24px;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #888;
            font-size: 12px;
            text-align: left;
            text-shadow: none;
        }
        
        .control-item {
            margin: 5px 0;
        }
        
        input[type="range"] {
            width: 100px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>✨ Cosmic Particle Streams</h2>
        <p>Multiple light particles dancing in the universe</p>
        <p style="margin-top: 10px; font-size: 12px;">
            Total Particles: <span id="particleCount">0</span>
        </p>
    </div>
    
    <div class="controls">
        <div class="control-item">
            Speed: <input type="range" id="speedControl" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="control-item">
            Particle Size: <input type="range" id="sizeControl" min="0.5" max="3" step="0.1" value="1">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 基本設置
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);
        
        camera.position.set(0, 0, 30);
        camera.lookAt(0, 0, 0);
        
        // 全局變數
        let totalParticles = 0;
        let speedMultiplier = 1;
        let sizeMultiplier = 1;
        
        // ===== 星星背景 =====
        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starPositions = [];
            const starColors = [];
            
            for (let i = 0; i < 800; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const r = 100 + Math.random() * 50;
                
                starPositions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                
                const brightness = 0.5 + Math.random() * 0.5;
                const colorChoice = Math.random();
                if (colorChoice < 0.7) {
                    starColors.push(brightness, brightness, brightness);
                } else if (colorChoice < 0.85) {
                    starColors.push(brightness * 0.8, brightness * 0.9, brightness);
                } else {
                    starColors.push(brightness, brightness * 0.95, brightness * 0.9);
                }
            }
            
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPositions), 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(starColors), 3));
            
            const starsMaterial = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                sizeAttenuation: true
            });
            
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }
        
        // ===== 粒子串流系統 =====
        class ParticleStream {
            constructor(x, y, z, color, count = 3000) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.color = color;
                this.count = count;
                this.particles = [];
                this.velocities = [];
                this.ages = [];
                this.lifetime = 200;
                
                this.geometry = new THREE.BufferGeometry();
                this.positions = new Float32Array(count * 3);
                this.colors = new Float32Array(count * 3);
                
                for (let i = 0; i < count; i++) {
                    this.positions[i * 3] = x;
                    this.positions[i * 3 + 1] = y;
                    this.positions[i * 3 + 2] = z;
                    
                    this.colors[i * 3] = color.r;
                    this.colors[i * 3 + 1] = color.g;
                    this.colors[i * 3 + 2] = color.b;
                    
                    const speed = (0.1 + Math.random() * 0.3) * speedMultiplier;
                    const angle = Math.random() * Math.PI * 2;
                    const elevation = Math.random() * Math.PI * 2;
                    
                    this.velocities.push({
                        x: Math.cos(angle) * Math.sin(elevation) * speed,
                        y: Math.sin(angle) * Math.sin(elevation) * speed,
                        z: Math.cos(elevation) * speed
                    });
                    
                    this.ages.push(Math.random() * this.lifetime);
                }
                
                this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
                this.geometry.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.15 * sizeMultiplier,
                    vertexColors: true,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.8
                });
                
                this.mesh = new THREE.Points(this.geometry, material);
                scene.add(this.mesh);
                this.material = material;
            }
            
            update() {
                for (let i = 0; i < this.count; i++) {
                    const idx = i * 3;
                    
                    // 更新年齡
                    this.ages[i]++;
                    if (this.ages[i] > this.lifetime) {
                        this.ages[i] = 0;
                        this.positions[idx] = this.x + (Math.random() - 0.5) * 2;
                        this.positions[idx + 1] = this.y + (Math.random() - 0.5) * 2;
                        this.positions[idx + 2] = this.z + (Math.random() - 0.5) * 2;
                    }
                    
                    // 應用速度
                    this.positions[idx] += this.velocities[i].x;
                    this.positions[idx + 1] += this.velocities[i].y;
                    this.positions[idx + 2] += this.velocities[i].z;
                    
                    // 渦流效應
                    const px = this.positions[idx];
                    const py = this.positions[idx + 1];
                    const pz = this.positions[idx + 2];
                    const dist = Math.sqrt(px * px + py * py);
                    
                    if (dist < 30) {
                        const force = (1 - dist / 30) * 0.02;
                        const angle = Math.atan2(py, px);
                        this.velocities[i].x += Math.cos(angle + Math.PI / 2) * force;
                        this.velocities[i].y += Math.sin(angle + Math.PI / 2) * force;
                        this.velocities[i].z += (Math.random() - 0.5) * 0.01;
                    }
                    
                    // 阻尼
                    this.velocities[i].x *= 0.98;
                    this.velocities[i].y *= 0.98;
                    this.velocities[i].z *= 0.98;
                    
                    // 淡出效果
                    const alpha = 1 - (this.ages[i] / this.lifetime) * 0.7;
                    this.colors[idx + 3] = this.color.r * alpha;
                    this.colors[idx + 4] = this.color.g * alpha;
                    this.colors[idx + 5] = this.color.b * alpha;
                }
                
                this.geometry.attributes.position.needsUpdate = true;
                this.geometry.attributes.color.needsUpdate = true;
                this.material.size = 0.15 * sizeMultiplier;
            }
        }
        
        // ===== 創建場景 =====
        createStars();
        
        const colors = [
            { r: 0.2, g: 0.5, b: 1.0 },    // 藍色
            { r: 1.0, g: 0.3, b: 0.5 },    // 粉紅色
            { r: 0.3, g: 1.0, b: 0.5 },    // 綠色
            { r: 1.0, g: 0.8, b: 0.2 },    // 金色
            { r: 0.8, g: 0.3, b: 1.0 }     // 紫色
        ];
        
        const streams = [];
        for (let i = 0; i < colors.length; i++) {
            const angle = (i / colors.length) * Math.PI * 2;
            const radius = 15;
            const x = radius * Math.cos(angle);
            const y = radius * Math.sin(angle);
            const z = (Math.random() - 0.5) * 5;
            
            const stream = new ParticleStream(x, y, z, colors[i], 4000);
            streams.push(stream);
            totalParticles += 4000;
        }
        
        totalParticles += 800; // 星星
        document.getElementById('particleCount').textContent = totalParticles.toLocaleString();
        
        // ===== 控制器 =====
        document.getElementById('speedControl').addEventListener('change', (e) => {
            speedMultiplier = parseFloat(e.target.value);
        });
        
        document.getElementById('sizeControl').addEventListener('change', (e) => {
            sizeMultiplier = parseFloat(e.target.value);
        });
        
        // ===== 動畫循環 =====
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            // 旋轉相機
            const cameraRadius = 35;
            const cameraAngle = time * 0.2;
            camera.position.x = cameraRadius * Math.cos(cameraAngle);
            camera.position.y = cameraRadius * Math.sin(cameraAngle);
            camera.position.z = 20 + 10 * Math.sin(time * 0.3);
            camera.lookAt(0, 0, 0);
            
            // 更新粒子流
            for (let stream of streams) {
                stream.update();
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // ===== 響應視窗調整 =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
