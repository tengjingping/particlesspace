<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Particle Forge — 粒子模擬器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000005; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 240px;
    background: rgba(5, 5, 20, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(120, 180, 255, 0.2);
    border-radius: 12px;
    padding: 14px;
    color: #cdd;
    font-size: 12px;
    z-index: 100;
    user-select: none;
  }

  #ui h1 {
    font-size: 14px;
    font-weight: bold;
    color: #7af;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-align: center;
  }

  .section-label {
    color: #778;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  select {
    width: 100%;
    background: rgba(255,255,255,0.07);
    color: #eef;
    border: 1px solid rgba(120,180,255,0.25);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: #7af; }

  .param-row { margin-bottom: 8px; }
  .param-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }
  .param-label { color: #99b; font-size: 11px; }
  .param-val { color: #7af; font-size: 11px; font-weight: bold; min-width: 32px; text-align: right; }

  input[type=range] {
    width: 100%;
    height: 4px;
    accent-color: #5af;
    cursor: pointer;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(120,180,255,0.15);
    margin: 10px 0;
  }

  .btn-row { display: flex; gap: 6px; margin-top: 8px; }
  button {
    flex: 1;
    background: rgba(255,255,255,0.07);
    color: #cde;
    border: 1px solid rgba(120,180,255,0.25);
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: rgba(100,180,255,0.15); border-color: #7af; color: #fff; }
  button:active { transform: scale(0.97); }

  #info-bar {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(5,5,20,0.7);
    border: 1px solid rgba(120,180,255,0.15);
    border-radius: 20px;
    padding: 5px 18px;
    color: #556;
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
  }

  #fps {
    position: fixed;
    top: 16px;
    right: 16px;
    color: rgba(120,180,255,0.4);
    font-size: 11px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <h1>⬡ PARTICLE FORGE</h1>

  <div class="section-label">模式 Mode</div>
  <select id="mode">
    <option value="lorenz">Lorenz 混沌吸引子</option>
    <option value="spiral">螺旋星系</option>
    <option value="sphere">脈衝球體</option>
    <option value="dna">DNA 雙螺旋</option>
    <option value="wave">量子波場</option>
    <option value="torus">環形漩渦</option>
    <option value="galaxy">銀河系核</option>
    <option value="blackhole">黑洞吸積盤</option>
  </select>

  <div id="sliders"></div>

  <hr class="divider">
  <div class="section-label">色彩 Color</div>
  <select id="colormode">
    <option value="rainbow">彩虹 Rainbow</option>
    <option value="fire">火焰 Fire</option>
    <option value="ocean">深海 Ocean</option>
    <option value="neon">霓虹 Neon</option>
    <option value="gold">星塵 Stardust</option>
    <option value="ice">極光 Aurora</option>
  </select>

  <hr class="divider">
  <div class="section-label">粒子數 Particles</div>
  <div class="param-row">
    <div class="param-top">
      <span class="param-label">數量</span>
      <span class="param-val" id="v_count">15,000</span>
    </div>
    <input type="range" id="sl_count" min="2000" max="30000" step="1000" value="15000">
  </div>
  <div class="param-row">
    <div class="param-top">
      <span class="param-label">粒子大小</span>
      <span class="param-val" id="v_size">0.7</span>
    </div>
    <input type="range" id="sl_size" min="0.2" max="3" step="0.1" value="0.7">
  </div>

  <div class="btn-row">
    <button id="pauseBtn">⏸ 暫停</button>
    <button id="resetBtn">↺ 重置</button>
    <button id="screenshotBtn">📷 截圖</button>
  </div>
</div>

<div id="info-bar">拖曳旋轉 · 滾輪縮放 · 右鍵平移</div>
<div id="fps">-- FPS</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Renderer Setup ──────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000008);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 0, 200);

// ── Particle System ──────────────────────────────────────────
let N = 15000;
let positions, colors, geo, mat, points;

function buildParticleSystem(n) {
  if (points) scene.remove(points);
  N = n;
  positions = new Float32Array(N * 3);
  colors    = new Float32Array(N * 3);
  geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  mat = new THREE.PointsMaterial({ size: particleSize, vertexColors: true, sizeAttenuation: true });
  points = new THREE.Points(geo, mat);
  scene.add(points);
}

let particleSize = 0.7;
buildParticleSystem(N);

// ── Lorenz Cache ─────────────────────────────────────────────
let lorenzPts = [];
function computeLorenz(sigma, rho) {
  lorenzPts = [];
  let x = 1, y = 1, z = 1;
  const dt = 0.008, b = 8 / 3;
  for (let i = 0; i < 60000; i++) {
    const dx = sigma * (y - x);
    const dy = x * (rho - z) - y;
    const dz = x * y - b * z;
    x += dx * dt; y += dy * dt; z += dz * dt;
    lorenzPts.push(x, y, z);
  }
}

// ── Mode Params ──────────────────────────────────────────────
const PARAMS = {
  lorenz:    [
    {id:'speed',  label:'速度 Speed',   min:0.1, max:3,   val:1,  step:0.1},
    {id:'sigma',  label:'σ Sigma',      min:1,   max:20,  val:10, step:0.5},
    {id:'rho',    label:'ρ Rho',        min:10,  max:50,  val:28, step:0.5},
    {id:'scale',  label:'縮放 Scale',   min:10,  max:80,  val:38, step:1},
  ],
  spiral:    [
    {id:'arms',   label:'旋臂 Arms',    min:1,   max:8,   val:3,  step:1},
    {id:'tight',  label:'緊密 Tight',   min:0.2, max:5,   val:1,  step:0.1},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:3,   val:0.5,step:0.1},
    {id:'scale',  label:'縮放 Scale',   min:30,  max:150, val:80, step:5},
  ],
  sphere:    [
    {id:'freq',   label:'頻率 Freq',    min:0.5, max:8,   val:2,  step:0.5},
    {id:'amp',    label:'振幅 Amp',     min:0.1, max:5,   val:1,  step:0.1},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:3,   val:1,  step:0.1},
    {id:'scale',  label:'縮放 Scale',   min:20,  max:120, val:70, step:5},
  ],
  dna:       [
    {id:'turns',  label:'圈數 Turns',   min:1,   max:15,  val:6,  step:1},
    {id:'radius', label:'半徑 Radius',  min:5,   max:50,  val:18, step:1},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:3,   val:1,  step:0.1},
    {id:'height', label:'高度 Height',  min:50,  max:200, val:120,step:5},
  ],
  wave:      [
    {id:'freq',   label:'頻率 Freq',    min:0.5, max:8,   val:2,  step:0.5},
    {id:'layers', label:'層數 Layers',  min:1,   max:6,   val:3,  step:1},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:3,   val:1,  step:0.1},
    {id:'scale',  label:'縮放 Scale',   min:20,  max:150, val:70, step:5},
  ],
  torus:     [
    {id:'R',      label:'主半徑 R',     min:20,  max:100, val:55, step:5},
    {id:'r',      label:'管半徑 r',     min:5,   max:40,  val:22, step:1},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:3,   val:1,  step:0.1},
    {id:'twist',  label:'扭轉 Twist',   min:0,   max:8,   val:1,  step:0.2},
  ],
  galaxy:    [
    {id:'arms',   label:'旋臂 Arms',    min:1,   max:6,   val:2,  step:1},
    {id:'bulge',  label:'核心 Bulge',   min:0.1, max:1,   val:0.3,step:0.05},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:2,   val:0.3,step:0.05},
    {id:'scale',  label:'縮放 Scale',   min:30,  max:150, val:90, step:5},
  ],
  blackhole: [
    {id:'inner',  label:'內徑 Inner',   min:5,   max:40,  val:15, step:1},
    {id:'outer',  label:'外徑 Outer',   min:40,  max:150, val:90, step:5},
    {id:'speed',  label:'速度 Speed',   min:0.1, max:5,   val:2,  step:0.1},
    {id:'warp',   label:'翹曲 Warp',    min:0,   max:3,   val:1,  step:0.1},
  ],
};

let currentMode = 'lorenz';
let P = {};

function buildSliders(mode) {
  const container = document.getElementById('sliders');
  container.innerHTML = '';
  P = {};
  (PARAMS[mode] || []).forEach(p => {
    P[p.id] = p.val;
    const row = document.createElement('div');
    row.className = 'param-row';
    const top = document.createElement('div');
    top.className = 'param-top';
    const valSpan = document.createElement('span');
    valSpan.className = 'param-val';
    valSpan.id = 'v_' + p.id;
    valSpan.textContent = p.val.toFixed(p.step < 1 ? 1 : 0);
    top.innerHTML = `<span class="param-label">${p.label}</span>`;
    top.appendChild(valSpan);
    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = p.min; sl.max = p.max;
    sl.step = p.step; sl.value = p.val;
    sl.oninput = () => {
      P[p.id] = parseFloat(sl.value);
      valSpan.textContent = parseFloat(sl.value).toFixed(p.step < 1 ? 1 : 0);
      if (mode === 'lorenz') computeLorenz(P.sigma || 10, P.rho || 28);
    };
    row.appendChild(top);
    row.appendChild(sl);
    container.appendChild(row);
  });
}

// ── Color Functions ──────────────────────────────────────────
function hsl2rgb(h, s, l) {
  h = h % 1; if (h < 0) h += 1;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if      (h < 1/6) { r=c; g=x; }
  else if (h < 2/6) { r=x; g=c; }
  else if (h < 3/6) { g=c; b=x; }
  else if (h < 4/6) { g=x; b=c; }
  else if (h < 5/6) { r=x; b=c; }
  else              { r=c; b=x; }
  return [r+m, g+m, b+m];
}

function getColor(fi, t, cm) {
  const h = (fi + t * 0.04) % 1;
  if (cm === 'rainbow') return hsl2rgb(h, 1, 0.55);
  if (cm === 'fire') {
    const v = fi;
    return [Math.min(1, v * 2.5), Math.max(0, v * 1.5 - 0.3), Math.max(0, v - 0.7)];
  }
  if (cm === 'ocean') return hsl2rgb(0.55 + fi * 0.15, 0.9, 0.35 + fi * 0.3);
  if (cm === 'neon') {
    return [
      Math.abs(Math.sin(fi * Math.PI * 3 + t * 0.3)),
      Math.abs(Math.sin(fi * Math.PI * 3 + 2.1 + t * 0.2)),
      Math.abs(Math.sin(fi * Math.PI * 3 + 4.2 + t * 0.1)),
    ];
  }
  if (cm === 'gold') return [0.9 + 0.1 * Math.sin(h * 8), 0.6 + 0.35 * fi, 0.05 + 0.2 * fi];
  if (cm === 'ice')  return hsl2rgb(0.5 + fi * 0.15, 0.8, 0.5 + 0.3 * Math.sin(fi * Math.PI));
  return [1, 1, 1];
}

// ── Per-frame Update ─────────────────────────────────────────
function updateParticles(t) {
  const cm = document.getElementById('colormode').value;
  const p = P;

  for (let i = 0; i < N; i++) {
    const fi = i / N;
    let x = 0, y = 0, z = 0;

    if (currentMode === 'lorenz') {
      const sc = p.scale || 38;
      const speed = p.speed || 1;
      const offset = Math.floor(((t * speed * 4000) % lorenzPts.length) / 3);
      const idx = ((i * Math.floor(lorenzPts.length / 3 / N)) + offset) % (lorenzPts.length / 3);
      const base = idx * 3;
      x = lorenzPts[base]     * sc * 0.012;
      y = lorenzPts[base + 1] * sc * 0.012;
      z = lorenzPts[base + 2] * sc * 0.012 - sc * 0.3;

    } else if (currentMode === 'spiral') {
      const arms  = Math.max(1, Math.round(p.arms || 3));
      const tight = p.tight || 1;
      const sc    = p.scale || 80;
      const speed = p.speed || 0.5;
      const arm   = i % arms;
      const r     = Math.pow(fi, 0.6) * sc;
      const angle = fi * tight * 5 * Math.PI + (arm / arms) * Math.PI * 2 + t * speed;
      const spread = (Math.random() - 0.5) * 2; // baked noise via fi hash
      const noise  = Math.sin(fi * 1273.4) * 4;
      x = Math.cos(angle) * r + noise;
      z = Math.sin(angle) * r + Math.cos(fi * 937) * 3;
      y = (fi - 0.5) * 15 + Math.sin(fi * 7 + t * 0.3) * 5;

    } else if (currentMode === 'sphere') {
      const sc    = p.scale || 70;
      const freq  = p.freq  || 2;
      const amp   = p.amp   || 1;
      const speed = p.speed || 1;
      const phi   = Math.acos(1 - 2 * fi);
      const theta = Math.PI * 2 * fi * 2.618;
      const pulse = 1 + amp * 0.25 * Math.sin(t * freq * 0.7 + fi * Math.PI * 5);
      x = sc * pulse * Math.sin(phi) * Math.cos(theta);
      y = sc * pulse * Math.cos(phi);
      z = sc * pulse * Math.sin(phi) * Math.sin(theta);

    } else if (currentMode === 'dna') {
      const turns  = p.turns  || 6;
      const radius = p.radius || 18;
      const speed  = p.speed  || 1;
      const height = p.height || 120;
      const angle  = fi * turns * 2 * Math.PI + t * speed * 0.8;
      const strand  = i % 3;
      if (strand === 2) {
        const q   = Math.floor(fi * turns * 2) / (turns * 2);
        const a1  = q * turns * 2 * Math.PI + t * speed * 0.8;
        x = (Math.cos(a1) + Math.cos(a1 + Math.PI)) * radius * 0.5;
        z = (Math.sin(a1) + Math.sin(a1 + Math.PI)) * radius * 0.5;
        y = (fi - 0.5) * height;
      } else {
        const offset = strand === 0 ? 0 : Math.PI;
        x = Math.cos(angle + offset) * radius;
        z = Math.sin(angle + offset) * radius;
        y = (fi - 0.5) * height;
      }

    } else if (currentMode === 'wave') {
      const sc     = p.scale  || 70;
      const freq   = p.freq   || 2;
      const layers = Math.max(1, Math.round(p.layers || 3));
      const speed  = p.speed  || 1;
      const layer  = i % layers;
      const ni     = Math.floor(i / layers);
      const cols   = Math.ceil(Math.sqrt(N / layers));
      const row    = Math.floor(ni / cols);
      const col    = ni % cols;
      x = (col / cols - 0.5) * sc * 2;
      z = (row / cols - 0.5) * sc * 2;
      const dist = Math.sqrt(x * x + z * z);
      y = 18 * Math.sin(dist * freq * 0.08 - t * speed) + (layer - (layers - 1) / 2) * 10;

    } else if (currentMode === 'torus') {
      const R     = p.R     || 55;
      const r     = p.r     || 22;
      const speed = p.speed || 1;
      const twist = p.twist || 1;
      const u     = fi * Math.PI * 2;
      const v     = fi * Math.PI * 2 * N * 0.0137 + t * twist * 0.3;
      x = (R + r * Math.cos(v)) * Math.cos(u + t * speed * 0.25);
      y = r * Math.sin(v);
      z = (R + r * Math.cos(v)) * Math.sin(u + t * speed * 0.25);

    } else if (currentMode === 'galaxy') {
      const arms   = Math.max(1, Math.round(p.arms || 2));
      const bulge  = p.bulge || 0.3;
      const sc     = p.scale || 90;
      const speed  = p.speed || 0.3;
      const arm    = i % arms;
      const r      = Math.pow(fi, 0.5) * sc;
      const isCore = fi < bulge;
      if (isCore) {
        const phi   = Math.acos(1 - 2 * (fi / bulge));
        const theta = Math.PI * 2 * fi * 2.618;
        const cr    = (fi / bulge) * sc * bulge;
        x = cr * Math.sin(phi) * Math.cos(theta);
        y = cr * Math.cos(phi) * 0.3;
        z = cr * Math.sin(phi) * Math.sin(theta);
      } else {
        const angle = ((fi - bulge) / (1 - bulge)) * 4 * Math.PI
                      + (arm / arms) * Math.PI * 2 + t * speed;
        const spread = Math.sin(fi * 3741.7) * 4;
        x = Math.cos(angle) * r + spread;
        z = Math.sin(angle) * r + Math.cos(fi * 9317) * 3;
        y = Math.sin(fi * 5237) * 5 * (1 - fi);
      }

    } else if (currentMode === 'blackhole') {
      const inner = p.inner || 15;
      const outer = p.outer || 90;
      const speed = p.speed || 2;
      const warp  = p.warp  || 1;
      const r     = inner + (outer - inner) * Math.pow(fi, 0.5);
      const angle = fi * 2 * Math.PI * N * 0.01 + t * speed * (inner / r);
      const disk_y = Math.sin(fi * 7319) * 3 * (r / outer);
      const lensing = Math.exp(-r / (inner * warp)) * 20;
      x = r * Math.cos(angle);
      z = r * Math.sin(angle);
      y = disk_y + lensing * Math.sin(t * 3 + fi * 20);
    }

    positions[i * 3]     = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    const [cr, cg, cb] = getColor(fi, t, cm);
    colors[i * 3]     = cr;
    colors[i * 3 + 1] = cg;
    colors[i * 3 + 2] = cb;
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate    = true;
}

// ── Mouse / Touch Controls ───────────────────────────────────
let isDragging = false, isRightDrag = false;
let lastX = 0, lastY = 0;
let rotY = 0, rotX = 0;
const panOffset = new THREE.Vector3();

canvas.addEventListener('mousedown', e => {
  isDragging  = true;
  isRightDrag = e.button === 2;
  lastX = e.clientX; lastY = e.clientY;
  e.preventDefault();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (isRightDrag) {
    panOffset.x += dx * 0.15;
    panOffset.y -= dy * 0.15;
  } else {
    rotY += dx * 0.008;
    rotX += dy * 0.008;
  }
  lastX = e.clientX; lastY = e.clientY;
});
document.addEventListener('mouseup', () => isDragging = false);

canvas.addEventListener('touchstart', e => {
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  rotY += (e.touches[0].clientX - lastX) * 0.01;
  rotX += (e.touches[0].clientY - lastY) * 0.01;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('wheel', e => {
  camera.position.z = Math.max(30, Math.min(500, camera.position.z + e.deltaY * 0.25));
}, { passive: true });

// ── Resize ───────────────────────────────────────────────────
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── FPS Counter ──────────────────────────────────────────────
let fpsEl = document.getElementById('fps');
let frames = 0, lastFpsTime = performance.now();

// ── Animation Loop ───────────────────────────────────────────
let simTime = 0, paused = false;
let prevTs = 0;

function animate(ts) {
  requestAnimationFrame(animate);
  const dt = Math.min((ts - prevTs) / 1000, 0.05);
  prevTs = ts;
  if (!paused) simTime += dt;

  points.rotation.y = rotY;
  points.rotation.x = rotX;
  points.position.set(panOffset.x, panOffset.y, 0);

  updateParticles(simTime);
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - lastFpsTime > 500) {
    fpsEl.textContent = Math.round(frames * 1000 / (now - lastFpsTime)) + ' FPS';
    frames = 0;
    lastFpsTime = now;
  }
}
animate(0);

// ── Init ─────────────────────────────────────────────────────
buildSliders('lorenz');
computeLorenz(10, 28);

document.getElementById('mode').onchange = function () {
  currentMode = this.value;
  buildSliders(currentMode);
  if (currentMode === 'lorenz') computeLorenz(P.sigma || 10, P.rho || 28);
};

document.getElementById('sl_count').oninput = function () {
  const n = parseInt(this.value);
  document.getElementById('v_count').textContent = n.toLocaleString();
  buildParticleSystem(n);
  if (currentMode === 'lorenz') computeLorenz(P.sigma || 10, P.rho || 28);
};

document.getElementById('sl_size').oninput = function () {
  const s = parseFloat(this.value);
  document.getElementById('v_size').textContent = s.toFixed(1);
  particleSize = s;
  if (mat) mat.size = s;
};

document.getElementById('pauseBtn').onclick = function () {
  paused = !paused;
  this.textContent = paused ? '▶ 繼續' : '⏸ 暫停';
};

document.getElementById('resetBtn').onclick = function () {
  simTime = 0; rotX = 0; rotY = 0;
  panOffset.set(0, 0, 0);
  camera.position.set(0, 0, 200);
  if (currentMode === 'lorenz') computeLorenz(P.sigma || 10, P.rho || 28);
};

document.getElementById('screenshotBtn').onclick = function () {
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'particle-forge.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
};
</script>
</body>
</html>
